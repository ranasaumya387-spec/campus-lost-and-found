spring.application.name=campus-lost-found
server.port=8080

# File-based H2 database: records persist between restarts.
spring.datasource.url=jdbc:h2:file:./data/lostfounddb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Optional H2 console for local development
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
